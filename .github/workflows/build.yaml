name: Ubuntu

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  with_docker:
    strategy:
      matrix:
        include:
          - image: ubuntu-24.04
            arch: x86_64
          - image: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.image }}
    env:
      cache-key: docker-buildx-cache-${{ matrix.arch }}
    permissions:
      actions: write
    steps:
    - name: remove unused resources
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: wx257osn2/setup-apptainer@v1.3.6
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: actions/cache/restore@v4
      id: cached
      with:
        path: /tmp/.docker-buildx-cache
        key: ${{ env.cache-key }}
    - name: build
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends proot
        if [[ "${{ github.ref }}" = "refs/heads/master" ]]; then
          DOCKER_BUILD_EXTRA_OPTIONS="--cache-to type=local,mode=max,dest=/tmp/.docker-buildx-cache-new --cache-from type=local,src=/tmp/.docker-buildx-cache --load" ./build.bash
          rm -rf /tmp/.docker-buildx-cache
          mv /tmp/.docker-buildx-cache-new /tmp/.docker-buildx-cache
        else
          DOCKER_BUILD_EXTRA_OPTIONS="--cache-from type=local,src=/tmp/.docker-buildx-cache --load" ./build.bash
        fi
    - name: remove previous cache
      if: github.ref == 'refs/heads/master' && steps.cached.outputs.cache-hit
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh extension install actions/gh-actions-cache
        gh actions-cache delete "${{ env.cache-key }}" --confirm
    - uses: actions/cache/save@v4
      if: github.ref == 'refs/heads/master'
      with:
        path: /tmp/.docker-buildx-cache
        key: ${{ env.cache-key }}
  standalone:
    strategy:
      matrix:
        include:
          - image: ubuntu-24.04
            arch: x86_64
          - image: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.image }}
    steps:
    - uses: wx257osn2/setup-apptainer@v1.3.6
    - uses: actions/checkout@v4
    - name: build
      shell: bash
      run: |
        bash build.bash
    - id: check-tag
      run: |
        if [[ ${{ github.ref }} =~ ^refs/tags/v[1-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]$ ]]; then
          echo "deploy-needed=true" >> $GITHUB_OUTPUT
        fi
    - uses: actions/upload-artifact@v4
      if: steps.check-tag.outputs.deploy-needed == 'true'
      with:
        name: sif-${{ matrix.arch }}
        path: ./cxx-${{ matrix.arch }}.sif
  deploy:
    runs-on: ubuntu-24.04
    needs: standalone
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - id: check-tag
      run: |
        if [[ ${{ github.ref }} =~ ^refs/tags/v[1-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]$ ]]; then
          echo "deploy-needed=true" >> $GITHUB_OUTPUT
        fi
    - uses: actions/download-artifact@v4
      if: steps.check-tag.outputs.deploy-needed == 'true'
      with:
        name: sif-x86_64
    - uses: actions/download-artifact@v4
      if: steps.check-tag.outputs.deploy-needed == 'true'
      with:
        name: sif-aarch64
    - uses: softprops/action-gh-release@v2
      if: steps.check-tag.outputs.deploy-needed == 'true'
      with:
        files: |
          cxx-x86_64.sif
          cxx-aarch64.sif
