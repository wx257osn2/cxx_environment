name: Ubuntu

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  docker:
    strategy:
      matrix:
        image: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.image }}
    steps:
    - name: remove unused resources
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL $AGENT_TOOLSDIRECTORY /usr/local/share/boost /usr/lib/jvm /usr/share/swift /usr/local/julia /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/chromedriver-linux64 /usr/local/share/gecko_driver /usr/share/miniconda /usr/share/sbt /usr/local/share/vcpkg /home/.dotnet/tools /etc/skel/.dotnet/tools /home/linuxbrew /usr/share/apache-maven-* /usr/share/gradle-* /usr/local/.ghcup /home/.nvm /usr/local/share/emacs /usr/local/share/man /usr/local/share/chromium /usr/local/share/powershell /usr/local/share/doc /opt/actionarchivecache /opt/az /opt/google-cloud-sdk /opt/hostedtoolcache
        docker image prune --all --force
        sudo npm uninstall bazel || true
        sudo npm uninstall bazelisk || true
        rustup self uninstall -y
    - name: stop update man-page
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
    - run: sudo apt update
    - uses: wx257osn2/setup-apptainer@v1.4.4
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - uses: crazy-max/ghaction-github-runtime@v3
    - name: build
      shell: bash
      run: |
        mkdir -p docker_build
        mv installer docker_build/installer
        ARCH=$(uname -m)
        WIN_ARCH_0=${ARCH//86_/}
        WIN_ARCH=${WIN_ARCH_0//aarch/arm}
        docker buildx build -t cxx:latest -f ./Dockerfile --build-arg WIN_ARCH=${WIN_ARCH} --cache-from type=gha --cache-to type=gha,mode=max --load ./docker_build
  standalone:
    strategy:
      matrix:
        include:
          - image: ubuntu-24.04
            arch: x86_64
          - image: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.image }}
    steps:
    - name: stop update man-page
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
    - run: sudo apt update
    - uses: wx257osn2/setup-apptainer@v1.4.4
    - uses: actions/checkout@v5
    - name: build
      shell: bash
      run: |
        bash build.bash
    - id: check-tag
      run: |
        if [[ ${{ github.ref }} =~ ^refs/tags/v[1-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]$ ]]; then
          echo "deploy-needed=true" >> $GITHUB_OUTPUT
        fi
    - uses: actions/upload-artifact@v4
      if: steps.check-tag.outputs.deploy-needed == 'true'
      with:
        name: sif-${{ matrix.arch }}
        path: ./cxx-${{ matrix.arch }}.sif
  push:
    strategy:
      matrix:
        include:
          - image: ubuntu-24.04
            arch: x86_64
          - image: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.image }}
    needs: standalone
    if: startsWith(github.ref, 'refs/tags/v2')
    permissions:
      packages: write
    steps:
    - id: check-tag
      run: |
        if [[ ${{ github.ref }} =~ ^refs/tags/v[1-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]$ ]]; then
          echo "deploy-needed=true" >> $GITHUB_OUTPUT
        fi
    - uses: wx257osn2/setup-apptainer@v1.4.4
      if: steps.check-tag.outputs.deploy-needed == 'true'
    - uses: actions/download-artifact@v5
      if: steps.check-tag.outputs.deploy-needed == 'true'
      with:
        name: sif-${{ matrix.arch }}
    - run: echo -n $GITHUB_TOKEN | apptainer registry login --username ${{ github.actor }} --password-stdin oras://ghcr.io
      if: steps.check-tag.outputs.deploy-needed == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        version=${REF##refs/tags/}
        apptainer push cxx-${{ matrix.arch }}.sif oras://ghcr.io/wx257osn2/cxx_environment:${version}-${{ matrix.arch }}
      if: steps.check-tag.outputs.deploy-needed == 'true'
      env:
        REF: ${{ github.ref }}
  deploy:
    runs-on: ubuntu-24.04-arm
    needs: push
    if: startsWith(github.ref, 'refs/tags/v2')
    permissions:
      contents: write
    steps:
    - id: check-tag
      run: |
        if [[ ${{ github.ref }} =~ ^refs/tags/v[1-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]$ ]]; then
          echo "deploy-needed=true" >> $GITHUB_OUTPUT
        fi
    - run: |
        version=${REF##refs/tags/}
        echo '```' > release_notes
        echo "$ singularity pull oras://ghcr.io/wx257osn2/cxx_environment:${version}-x86_64 && mv cxx_environment_${version}-x86_64.sif cxx-x86_64.sif # or" >> release_notes
        echo "$ singularity pull oras://ghcr.io/wx257osn2/cxx_environment:${version}-aarch64 && mv cxx_environment_${version}-aarch64.sif cxx-aarch64.sif" >> release_notes
        echo '```' >> release_notes
      if: steps.check-tag.outputs.deploy-needed == 'true'
      env:
        REF: ${{ github.ref }}
    - uses: softprops/action-gh-release@v2
      if: steps.check-tag.outputs.deploy-needed == 'true'
      with:
        body_path: release_notes
