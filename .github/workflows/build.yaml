name: Ubuntu

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  with_docker:
    runs-on: ubuntu-24.04
    steps:
    - uses: eWaterCycle/setup-apptainer@v2
      with:
        apptainer-version: 1.3.6
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: crazy-max/ghaction-github-runtime@v3
    - name: build
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends proot
        DOCKER_BUILD_EXTRA_OPTIONS="--cache-to type=gha,mode=max --cache-from type=gha --load" ./build.bash
  standalone:
    runs-on: ubuntu-24.04
    steps:
    - uses: eWaterCycle/setup-apptainer@v2
      with:
        apptainer-version: 1.3.6
    - uses: actions/checkout@v4
    - name: build
      shell: bash
      run: ./build.bash
    - uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: sif
        path: ./cxx.sif
  deploy:
    runs-on: ubuntu-24.04
    needs: standalone
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: sif
    - uses: softprops/action-gh-release@v2
      with:
        files: cxx.sif
