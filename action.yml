name: 'Setup Modern C++ Development Environment'
description: 'Setup Modern C++ Development Environment based on Singularity'
author: 'I (@wx257osn2)'
inputs:
  version:
    description: 'select an image release'
    required: true
  image_name_prefix:
    description: 'image name prefix on the release; image name will be `${image_name_prefix}-${arch}.sif`'
    required: false
    default: 'cxx'
  url_format:
    description: 'image URL format, `{}` is replaced with inputs.version; When the URI is oras protocol, `-${arch}` will be concatenated from the back. Otherwise, `/${image_name_prefix}-${arch}.sif` will be concatenated from the back'
    required: false
    default: 'oras://ghcr.io/wx257osn2/cxx_environment:{}'
  save_cache:
    description: 'save cache or not: even if this flag is `false`, cache will be restored when there is the cache'
    required: false
    default: true
    type: boolean

runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        if [ ${{ runner.arch }} = "X64" ]; then
          download_arch="x86_64"
        elif [ ${{ runner.arch }} == "ARM64" ]; then
          download_arch="aarch64"
        fi
        echo "cxx_env_arch=${download_arch}" >> $GITHUB_ENV
        sudo mkdir -p /mnt/cxx_environment
        sudo chown $(id -u):$(id -g) /mnt/cxx_environment
    - uses: actions/cache@v4
      if: ${{ fromJSON(inputs.save_cache) }}
      with:
        path: /mnt/cxx_environment
        key: cxx_environment-${{ inputs.version }}-${{ env.cxx_env_arch }}
    - uses: actions/cache/restore@v4
      if: ${{ !fromJSON(inputs.save_cache) }}
      with:
        path: /mnt/cxx_environment
        key: cxx_environment-${{ inputs.version }}-${{ env.cxx_env_arch }}
    - uses: wx257osn2/setup-apptainer@v1.4.4
    - shell: bash
      run: |
        if [[ ${{ inputs.url_format }} == oras://* ]]; then
          echo "registry_oras=1" >> $GITHUB_ENV
        else
          echo "registry_oras=0" >> $GITHUB_ENV
        fi
    - shell: bash
      run: |
        version=v3.2.1
        sudo mkdir -p /mnt/cxx_environment/post_installer
        sudo curl -sSL -o /mnt/cxx_environment/cxx-env-run https://raw.githubusercontent.com/wx257osn2/cxx_environment/refs/tags/${version}/.cxx-env-run
        sudo curl -sSL -o /mnt/cxx_environment/post_installer/msvc-wine.bash https://raw.githubusercontent.com/wx257osn2/cxx_environment/refs/tags/${version}/post_installer/msvc-wine.bash
        sudo chmod +x /mnt/cxx_environment/cxx-env-run /mnt/cxx_environment/post_installer/msvc-wine.bash
        if [ ! -d /mnt/cxx_environment/sandbox ]; then
          if [ ${{ env.registry_oras }} -eq 1 ]; then
            apptainer pull $(echo ${{ inputs.url_format }} | sed "s/{}/${{ inputs.version }}/g")-${{ env.cxx_env_arch }}
            if [ $(find . -name '*.sif') != "./cxx-${{ env.cxx_env_arch }}.sif" ]; then
              mv $(find . -name '*.sif') cxx-${{ env.cxx_env_arch }}.sif
            fi
          else
            curl -sSL -o cxx-${{ env.cxx_env_arch }}.sif $(echo ${{ inputs.url_format }} | sed "s/{}/${{ inputs.version }}/g")/${{ inputs.image_name_prefix }}-${{ env.cxx_env_arch }}.sif
          fi
          sudo mv cxx-${{ env.cxx_env_arch }}.sif /mnt
          apptainer build --sandbox sandbox /mnt/cxx-${{ env.cxx_env_arch }}.sif
          sudo rm /mnt/cxx-${{ env.cxx_env_arch }}.sif
          sudo mv sandbox /mnt/cxx_environment/
        fi
        rm -rf ${{ github.workspace }}/cxx_environment
    - shell: bash
      run: |
        echo "PATH=${PATH}:/mnt/cxx_environment" >> $GITHUB_ENV
        echo "SINGULARITY=apptainer" >> $GITHUB_ENV
