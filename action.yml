name: 'Setup Modern C++ Development Environment'
description: 'Setup Modern C++ Development Environment based on Singularity'
author: 'I (@wx257osn2)'
inputs:
  version:
    description: 'select an image release'
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        repository: 'wx257osn2/cxx_environment'
        path: 'cxx_environment'
    - uses: actions/cache@v4
      with:
        path: /opt/cxx_environment/cxx.sif
        key: sif-${{ inputs.version }}
    - shell: bash
      run: |
        sudo mkdir -p /opt/cxx_environment
        sudo mv ${{ github.workspace }}/cxx_environment/run /opt/cxx_environment/cxx-env-run
        if [ ! -f /opt/cxx_environment/cxx.sif ]; then
          sudo curl -sSL -o /opt/cxx_environment/cxx.sif https://github.com/wx257osn2/cxx_environment/releases/download/${{ inputs.version }}/cxx.sif
        fi
        rm -rf ${{ github.workspace }}/cxx_environment
    - uses: wx257osn2/setup-apptainer@v1.3.6
    - shell: bash
      run: |
        echo "PATH=${PATH}:/opt/cxx_environment" >> $GITHUB_ENV
        echo "SINGULARITY=apptainer" >> $GITHUB_ENV
